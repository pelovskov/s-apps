<!-- lokalt-soegeindeks-genereret -->
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokalhistorisk søgeindeks</title>
<style>
:root{
  --accent:#9E2453;
  --paper:#FAF9F5;
  --paper-dim:#F1E7EC;
  --ink:#2B1A22;
  --line:#E3D3DA;
  --muted:#6B5560;
  --footer-strong:#3A2630;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5}
header{max-width:1100px;margin:0 auto;padding:34px 20px 10px}
h1{font-size:32px;margin:0 0 4px}
.sub{color:var(--muted);font-size:16px;margin:0}
.controls{max-width:1100px;margin:22px auto 6px;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap}
.controls input,.controls select{
  font-family:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);min-height:44px;
}
.controls input{flex:1 1 260px}
.controls select{flex:0 0 auto}
.count{max-width:1100px;margin:14px auto 0;padding:0 20px;color:var(--muted);font-size:15px}
.list{max-width:1100px;margin:10px auto 60px;padding:0 20px}
a.row{
  display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:var(--ink);
  padding:14px 14px;border-radius:8px;
}
a.row:hover{outline:2px solid var(--accent)}
a.row:focus-visible{outline:3px solid var(--accent)}
.row--a{background:var(--paper)}
.row--b{background:var(--paper-dim)}
.icon{font-size:22px;flex:0 0 30px}
.col-main{flex:1 1 auto;min-width:0}
.col-main .t{font-size:19px;font-weight:bold;color:var(--footer-strong)}
.col-main .m{font-size:14.5px;color:var(--muted);margin-top:2px}
.col-main .d{font-size:15px;color:var(--ink);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col-type{flex:0 0 auto;font-size:14px;color:var(--muted);align-self:center;white-space:nowrap}
.empty{padding:30px 0;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:10px 20px 50px;color:var(--muted);font-size:13.5px}
@media(max-width:640px){.col-type{display:none}}
</style>
</head>
<body>
<header>
<h1>Lokalhistorisk søgeindeks</h1>
<p class="sub">20 poster · genereret 17. August 2026, 18:13</p>
</header>

<div class="controls">
<input id="q" type="search" placeholder="Søg i titel, ophav, emne og beskrivelse …" aria-label="Søg">
<select id="typeFilter" aria-label="Filtrér på type"><option value="">Alle typer</option></select>
<select id="sortBy" aria-label="Sortér">
<option value="title">Titel A–Å</option>
<option value="date-new">Dato, nyeste først</option>
<option value="date-old">Dato, ældste først</option>
<option value="type">Type</option>
</select>
</div>

<p class="count" id="count"></p>
<div class="list" id="list"></div>

<footer>
Denne side er selvstændig og indeholder alt indhold direkte i filen. Genkør
<em>Byg-soegeside.command</em> i mappen for at opdatere søgeindekset, når der er
lagt nye filer til.
</footer>

<script>

impler og hænge dem på sejlets liner. Linerne blev så hængt op i havnens mastekran, så man kunne se hvad Roskildes b", "publisher": "Syd for Banen — Lokalhistorisk Forening", "contributor": "Niels Jørgen Rasmussen", "date": "2006", "type": "Image", "format": "text/html", "identifier": "Piwigo album 252", "source": "https://sfbbilleder.eu/index.php?/category/252", "language": "da", "relation": "", "coverage": "Roskilde", "rights": "CC BY-NC"}, {"filnavn": "hedeland-og-grusgrave.html", "appformat": "billedalbum", "title": "Hedeland og Grusgrave", "creator": "Niels Jørgen Rasmussen", "subject": "Grusgrave; Naturgenoprettelse;", "description": "Hedeland og grusgrave.Sydøst for Roskilde ligger en stor istidsaflejring, der indeholder store mængder grus og sten. Fra ca. 1900 og frem til omkring 1975 blev der gravet i det område, der i dag er Hedeland. Der blev også gravet andre steder f.eks. i Øde Hastrup, i Himmelev, i Darup og ved Svogersle", "publisher": "Syd for Banen", "contributor": "Niels Jørgen Rasmussen", "date": "2004-05-20/2026-06-16", "type": "Image", "format": "text/html", "identifier": "Piwigo album 297", "source": "https://sfbbilleder.eu/index.php?/category/297", "language": "da", "relation": "", "coverage": "Hedeland", "rights": "CC BY-NC"}, {"filnavn": "herfra-har-jeg-mange-minder.html", "appformat": "enkeltbillede", "title": "Gammel Landevej 25", "creator": "Poul Erik Løvskov", "subject": "vej i Roskilde; minder;", "description": "Det første lejlighedskompleks i Roskilde, opført som Socialt Boligbyggeri", "publisher": "Privat", "contributor": "Poul Erik Løvskov", "date": "2025-06-18", "type": "Image", "format": "text/html", "identifier": "https://sfbbilleder.eu/_data/i/upload/2025/06/18/20250618135847-68222799-me.jpg", "source": "Syd for Banens billedgalleri - Roskildebilleder", "language": "da", "relation": "https://sfbbilleder.eu/index.php?/category/177", "coverage": "Gammel Landevej 25, Roskilde", "rights": "CC BY-NC"}, {"filnavn": "krukkerne-paa-heste ject": "", "description": "Ringparken – Dengang og Nu Velkommen til historien om Ringparken – et levende stykke Roskilde historie fortalt gennem billeder. Da de første beboere i 1952 flyttede ind i Ringparkens splinternye lejligheder, var det kulminationen på en vision om at skabe moderne, sunde og lysfyldte rammer midt i en", "publisher": "Syd for Banen", "contributor": "", "date": "2010-01-29/2025-12-05", "type": "Image", "format": "text/html", "identifier": "Piwigo album 110", "source": "https://sfbbilleder.eu/index.php?/category/110", "language": "da", "relation": "", "coverage": "", "rights": ""}, {"filnavn": "samling-syd-for-banen.html", "appformat": "samling-forside", "title": "Syd for Banen", "creator": "Poul Erik Løvskov", "subject": "", "description": "Her har du nogle af vores digitale fortællinger. Der er både billed og lyd.", "publisher": "", "contributor": "", "date": "", "type": "Collection", "format": "text/html", "identifier": "", "source": "", "language": "da", "relation": "", "coverage": "", "rights": ""}, {"filnavn": "skridt-paa-asfalten.html", "appformat": "lydfortaelling-player", "title": "Når skridt på asfalten gør en forskel", "creator": "Poul Erik Løvskov", "subject": "Landsindsamling", "description": "En kølig luft af tidligt efterår, der rammer ansigtet og den velkendte lyd af en lille metaldåse, der klirrer blødt ved hvert skridt. Det er en helt almindelig søndag i Roskilde – og dog er den helt anderledes. For i dag går vi ikke bare for motionens skyld. Vi går for dem, der har allermest brug f…", "publisher": "Røde Kors Roskilde", "contributor": "Løvskov", "date": "2026-08-07", "type": "Sound", "format": "text/html", "identifier": "", "source": "", "language": "da", "relation": "", "coverage": "Roskilde", "rights": "Røde Kors Roskilde"}, {"filnavn": "stjernevinge.html", "appformat": "billedalbum", "title": "Stjernevinge", "creator": "Niels Jørgen Rasmussen", "subject": "jakobskirken; syd for banen;", "description": "et udsmykningsprojekt i Jakobskirken De lokale kunstnere Iben Brøndum og Helle Hove står bag dåbsudsmykningen i kirken. Deres skitseprojekt blev præsenteret i 2017, og en fundraising blandt sponsorer, erhvervsliv og private startede. Opsætningen skete i 2022. Ideen med udsmykningen er at lave en mos", "publisher": "Syd for Banen", "contributor": "Iben Brøndum og Helle Hove", "date": "2016-06-04/2026-03-04", "type": "Image", "format": "text/html", "identifier": "Piwigo album 299", "source": "https://sfbbilleder.eu/index.php?/category/299", "language": "da", "relation": "", "coverage": "", "rights": "MIT"}, {"filnavn": "stofbilleder-fra-aarsfester.html", "appformat": "billedalbum", "title": "Stofbilleder fra årsfester", "creator": "Niels Jørgen Rasmussen", "subject": "Østervangsskolen;", "description": "De små billedtæpper Ved Østervangsskolens indvielse i 1971 startede en tradition. Der skulle være en teaterforestilling hver aften for børn og forældre i hele den uge festen varede, og det var lærerne, der skulle op på scenen. Første forestilling var Kejseres nye klæder med daværende skoleinspektør M", "publisher": "", "contributor": "", "date": "2026-04-16", "type": "Image", "format": "text/html", "identifier": "Piwigo album 314", "source": "https://sfbbilleder.eu/index.php?/category/314", "language": "da", "relation": "", "coverage": "Østervangsskolen, Roskilde", "rights": ""}, {"filnavn": "topmoede-i-juli.html", "appformat": "billedalbum", "title": "Topmøde i juli", "creator": "Poul Erik Løvskov", "subject": "", "description": "Hjernetrusten holdt et statusmøde Vi skulle lige have gjort status på vores mange projekter. Det fik vi gjort og lagt planer om det videre arbejde. Det er flere podcasts, færdiggørelse af Lokalhistorie på tværs af generationer. Endelig så vil Poul Erik se på mulighederne for at gøre de vigtigste…", "publisher": "Syd for Banen", "contributor": "", "date": "2026-07-27", "type": "Image", "format": "text/html", "identifier": "", "source": "", "language": "da", "relation": "", "coverage": "Lammegade, Roskilde", "rights": ""}, {"filnavn": "viadukten.html", "appformat": "billedalbum", "title": "Viadukten", "creator": "Syd for Banen", "subject": "", "description": "ViaduktenViadukten er placeret i begyndelsen af Køgevej i Roskilde. Dens primære funktion er at føre togtrafik over Køgevej. Ved kraftig regn kan der forekomme oversvømmelser, og viadukten derfor kan være spærret.", "publisher": "Syd for Banen", "contributor": "njr mfl.", "date": "2016-02-26/2025-03-04", "type": "Image", "format": "text/html", "identifier": "Piwigo album 143", "source": "https://sfbbilleder.eu/index.php?/category/143", "language": "da", "relation": "", "coverage": "roskilde", "rights": ""}, {"filnavn": "viborg-domkirke.html", "appformat": "billedalbum", "title": "Viborg Domkirke", "creator": "Lena og Poul Erik Løvskov", "subject": "Donkirken i Viborg", "description": "Lena og jeg var en tur i Virborg i april 2025. Her er nogle af vores billeder.", "publisher": "", "contributor": "Lena og Poul Erik Løvskov", "date": "", "type": "Image", "format": "text/html", "identifier": "", "source": "", "language": "da", "relation": "", "coverage": "Viborg - 2025", "rights": ""}];
const ICONS = {Sound:"🎧",Image:"🖼️",Text:"📖",Collection:"🗂️",InteractiveResource:"🧩",Event:"📌"};

function yearOf(s){var m=(s||"").match(/\d{4}/); return m?m[0]:"0000";}

const typeSel = document.getElementById("typeFilter");
const seen = new Set();
DATA.forEach(r=>{ if(r.type) seen.add(r.type); });
Array.from(seen).sort().forEach(t=>{
  const o=document.createElement("option"); o.value=t; o.textContent=t;
  typeSel.appendChild(o);
});

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const type = typeSel.value;
  const sortBy = document.getElementById("sortBy").value;

  let rows = DATA.filter(r=>{
    if(type && r.type!==type) return false;
    if(!q) return true;
    const hay = (r.title+" "+r.creator+" "+r.subject+" "+r.description).toLowerCase();
    return hay.indexOf(q)!==-1;
  });

  rows = rows.slice().sort((a,b)=>{
    if(sortBy==="title") return a.title.localeCompare(b.title,"da");
    if(sortBy==="type") return (a.type||"").localeCompare(b.type||"","da");
    const ya=yearOf(a.date), yb=yearOf(b.date);
    return sortBy==="date-new" ? yb.localeCompare(ya) : ya.localeCompare(yb);
  });

  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("count").textContent =
    "Viser " + rows.length + " af " + DATA.length + " poster";

  if(rows.length===0){
    const p=document.createElement("p");
    p.className="empty"; p.textContent="Ingen poster matcher søgningen.";
    list.appendChild(p); return;
  }

  rows.forEach((r,i)=>{
    const a=document.createElement("a");
    a.className="row " + (i%2===0?"row--a":"row--b");
    a.href=encodeURI(r.filnavn); a.target="_blank"; a.rel="noopener";

    const icon=document.createElement("span");
    icon.className="icon"; icon.textContent = ICONS[r.type]||"📄";

    const main=document.createElement("span");
    main.className="col-main";
    const t=document.createElement("span"); t.className="t"; t.textContent=r.title;
    const m=document.createElement("span"); m.className="m";
    m.textContent=[r.creator,r.date].filter(Boolean).join(" · ");
    const d=document.createElement("span"); d.className="d"; d.textContent=r.description||"";
    main.appendChild(t); main.appendChild(document.createElement("br"));
    main.appendChild(m); main.appendChild(d);

    const typ=document.createElement("span");
    typ.className="col-type"; typ.textContent=r.type||"";

    a.appendChild(icon); a.appendChild(main); a.appendChild(typ);
    list.appendChild(a);
  });
}

document.getElementById("q").addEventListener("input", render);
typeSel.addEventListener("change", render);
document.getElementById("sortBy").addEventListener("change", render);
render();
</script>
</body>
</html>
